name: Required CI

# Org-enforced baseline CI. The organization ruleset references this public
# repository so public and private HomeLab-Forge repositories can run it.
#
# The org Actions policy allows GitHub-owned actions plus a small allow-list.
# Security tools are installed as pinned, checksum-verified binaries in `run:`
# steps instead of widening that allow-list.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f actionlint actionlint.tar.gz
      - name: Lint workflows
        run: |
          set -euo pipefail
          if compgen -G '.github/workflows/*.y*ml' > /dev/null; then
            actionlint -color
          else
            echo "No workflow files to lint."
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: "8.18.4"
          SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f gitleaks gitleaks.tar.gz
      - name: Scan working tree and history
        run: gitleaks detect --source . --redact --no-banner --verbose

  assign-owner:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign the PR to the org owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f "assignees[]=scepion1d" || true
